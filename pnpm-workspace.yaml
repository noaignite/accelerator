packages:
  - 'docs'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true

engineStrict: true
linkWorkspacePackages: true

overrides:
  'minimatch@3': ^3.1.5
  'brace-expansion@1': ^1.1.18
  '@xmldom/xmldom': ^0.9.12
  browserslist: ^4.28.7
  flatted: ^3.4.2
  'js-yaml@4': ^4.3.2
  nanoid: ^3.3.18
  picomatch: ^4.0.4
  postcss: ^8.5.18
  vite: ^8.0.16
