name: CI:Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

env:
  HUSKY: 0

jobs:
  test-and-coverage:
    runs-on: ubuntu-26.04
    env:
      TURBO_CACHE_DIR: .turbo/ci-cache
      TURBO_CACHE: local:rw
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{github.event.pull_request.head.sha}}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up node
        uses: actions/setup-node@v6
        with:
          # Keep CI on Node 24 so the bundled npm matches the release workflow's
          # OIDC-compatible npm version requirement for trusted publishing.
          node-version: '24.22.2'
          cache: 'pnpm'

      - name: Verify benchmark environment
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import os from "node:os"; assert.equal(process.version, "v24.22.2"); assert.equal(process.platform, "linux"); assert.equal(process.arch, "x64"); assert.equal(process.env.ImageOS, "ubuntu26"); assert.equal(process.env.ImageVersion, "20261111.196.1"); console.log(JSON.stringify({node: process.version, platform: process.platform, arch: process.arch, image: process.env.ImageOS, imageVersion: process.env.ImageVersion, cpus: os.availableParallelism(), memory: os.totalmem()}))'
          test "$(pnpm --version)" = "11.3.0"
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changeset status
        if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' }}
        run: pnpm ci:status

      - name: Run build
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm ci:test

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: packages
          fail_ci_if_error: true
