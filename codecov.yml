codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: 50..80
  status:
    project:
      default:
        target: 68%
        threshold: 1%
        # Partial PR reports must not be scored as complete repository coverage.
        flags: [full]
        flag_coverage_not_uploaded_behavior: exclude
    patch:
      default:
        target: 90%
        threshold: 1%

flags:
  full:
    carryforward: false
  affected:
    carryforward: false

comment:
  behavior: default
  # A PR's aggregate is partial, not a new repository-wide coverage score.
  layout: flags, files
  require_changes: true
